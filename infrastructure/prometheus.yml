global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: otel-collector
    static_configs:
      - targets: ["otel-collector:8889"]

  # В local/dev NestJS-сервисы запускаются на host-машине, а Prometheus -
  # внутри Docker. order-service публикует Kafka/outbox/DLQ metrics на 3003.
  - job_name: order-service
    metrics_path: /metrics
    static_configs:
      - targets: ["host.docker.internal:3003"]

  - job_name: kafka-workers
    metrics_path: /metrics
    static_configs:
      - targets:
          - "host.docker.internal:3004"
          - "host.docker.internal:3005"
          - "host.docker.internal:3006"
