syntax = "proto3";

package orders;

service OrdersService {
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  rpc CancelOrder (CancelOrderRequest) returns (CancelOrderResponse);
}

message CreateOrderItem {
  string productId = 1;
  int32 quantity = 2;
  double unitPrice = 3;
}

message CreateOrderRequest {
  string userId = 1;
  string currency = 2;
  repeated CreateOrderItem items = 3;
}

message CreateOrderResponse {
  string id = 1;
  string status = 2;
  string userId = 3;
  string currency = 4;
  double totalAmount = 5;
  int32 itemCount = 6;
  string createdAt = 7;
}

message CancelOrderRequest {
  string id = 1;
  string reason = 2;
  string requestedBy = 3;
}

message CancelOrderResponse {
  string id = 1;
  string status = 2;
  string cancellationStatus = 3;
  string reason = 4;
  string requestedBy = 5;
  string currentStatus = 6;
}
